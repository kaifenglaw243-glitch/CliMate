<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="MedMY — Malaysian Clinical Companion">
<title>MedMY — Malaysian Clinical Companion</title>

<style>
:root{
--bg:#f5f7f7;
--card:#fff;
--text:#172022;
--muted:#667174;
--line:#dfe7e7;
--primary:#0f766e;
--primary2:#115e59;
--soft:#e7f5f3;
--danger:#b42318;
--warn:#9a6700;
--shadow:0 8px 24px rgba(16,24,40,.06)
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.55
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}

.topbar{
position:sticky;
top:0;
z-index:20;
background:rgba(255,255,255,.94);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px
}

.brand{
border:0;
background:none;
display:flex;
align-items:center;
gap:10px;
text-align:left;
color:var(--text)
}

.logo{
width:38px;
height:38px;
border-radius:12px;
background:var(--primary);
color:#fff;
display:grid;
place-items:center;
font-weight:800
}

.brand small{
display:block;
color:var(--muted);
font-size:11px
}

.top-actions{
display:flex;
gap:6px
}

.iconbtn{
border:0;
background:var(--soft);
border-radius:10px;
width:38px;
height:38px
}

.layout{
display:flex;
min-height:calc(100vh - 64px)
}

.sidebar{
width:230px;
background:var(--card);
border-right:1px solid var(--line);
padding:16px;
flex:none
}

.sidebar nav{
display:grid;
gap:5px
}

.navitem{
border:0;
background:none;
padding:11px 12px;
border-radius:10px;
text-align:left;
color:var(--muted)
}

.navitem.active,
.navitem:hover{
background:var(--soft);
color:var(--primary);
font-weight:700
}

.side-note{
font-size:11px;
color:var(--muted);
margin-top:22px
}

.main{
max-width:1200px;
width:100%;
padding:24px;
margin:auto
}

.page{display:none}
.page.active{display:block}

.hero{
background:linear-gradient(135deg,#0f766e,#115e59);
color:#fff;
border-radius:22px;
padding:28px;
margin-bottom:22px;
box-shadow:var(--shadow)
}

.hero h1{
margin:0 0 8px;
font-size:30px
}

.hero p{
margin:0 0 20px;
opacity:.92
}

.searchbar{
display:flex;
gap:8px
}

.searchbar input{
flex:1;
min-width:0
}

.input,
input,
textarea,
select{
border:1px solid var(--line);
border-radius:10px;
padding:10px 12px;
background:var(--card);
color:var(--text)
}

.primary{
background:var(--primary);
color:#fff;
border:0;
border-radius:10px;
padding:10px 15px;
font-weight:700
}

.section{margin:22px 0}
.section h2{font-size:20px}

.grid,
.topicgrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}

.card,
.topic,
.box,
.q{
background:var(--card);
border:1px solid var(--line);
border-radius:15px;
padding:16px;
box-shadow:var(--shadow)
}

.card{text-align:left}

.topic{
width:100%;
text-align:left
}

.topic:hover{
border-color:#9ccfca
}

.icon{font-size:24px}

.badge{
display:inline-block;
font-size:11px;
padding:3px 8px;
border-radius:999px;
background:var(--soft);
color:var(--primary);
font-weight:700;
margin-bottom:7px
}

.badge.red{
background:#fee4e2;
color:var(--danger)
}

.badge.yellow{
background:#fff4ce;
color:var(--warn)
}

.sub,
.muted{
color:var(--muted)
}

.toolbar{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
margin-bottom:18px
}

.chips{
display:flex;
flex-wrap:wrap;
gap:7px
}

.chip{
border:1px solid var(--line);
background:var(--card);
padding:7px 11px;
border-radius:999px
}

.chip.active{
background:var(--soft);
border-color:#9ccfca;
color:var(--primary);
font-weight:700
}

.detail{
max-width:900px;
margin:auto
}

.detail h1{
font-size:30px;
margin:8px 0
}

.box{
margin:14px 0
}

.box h3{
margin:0 0 8px
}

.box ul,
.box ol{
margin:8px 0 0;
padding-left:22px
}

.why{
border-left:4px solid var(--primary);
background:var(--soft)
}

.warning{
border-left:4px solid #d89b00;
background:#fff8dc
}

.dangerbox{
border-left:4px solid var(--danger);
background:#fff0ef
}

.pearls{
border-left:4px solid #7c3aed;
background:#f4efff
}

.source{
background:#f0f5ff;
border-left:4px solid #4f46e5
}

.tablewrap{
overflow:auto;
border:1px solid var(--line);
border-radius:12px
}

.clinical-table{
width:100%;
border-collapse:collapse;
min-width:650px
}

.clinical-table th,
.clinical-table td{
padding:9px 10px;
border-bottom:1px solid var(--line);
vertical-align:top;
text-align:left
}

.clinical-table th{
background:#f2f6f6;
font-size:12px
}

.flow{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:7px
}

.step{
background:var(--soft);
padding:8px 10px;
border-radius:9px;
font-weight:600
}

.arrow{color:var(--muted)}

.ref{
display:block;
margin:6px 0
}

.q{
margin:14px 0
}

.option{
display:block;
width:100%;
text-align:left;
background:var(--card);
border:1px solid var(--line);
border-radius:9px;
padding:9px;
margin-top:7px
}

.option.correct{
background:#e7f7ed;
border-color:#5abf7a
}

.option.wrong{
background:#fff0ef;
border-color:#e0786f
}

.explanation{
display:none;
margin-top:10px;
padding:10px;
border-radius:9px;
background:#f6f8f8
}

.q.done .explanation{
display:block
}

.back{
border:0;
background:none;
color:var(--primary);
font-weight:700;
padding:0;
margin-bottom:8px
}

.empty{
text-align:center;
padding:30px;
color:var(--muted);
background:var(--card);
border:1px dashed var(--line);
border-radius:14px
}

.bottomnav{
display:none
}

.drawer{
display:block!important
}

.dark{
--bg:#0d1415;
--card:#142021;
--text:#eef5f5;
--muted:#9fb0b0;
--line:#2b3a3b;
--soft:#183a37;
--shadow:none
}

.dark .topbar{
background:rgba(13,20,21,.94)
}

.dark .clinical-table th{
background:#1b2a2b
}

.dark .source{
background:#17213a
}

.dark .warning{
background:#2c2714
}

.dark .pearls{
background:#241b36
}

@media(max-width:800px){

.sidebar{
display:none
}

.sidebar.drawer{
position:fixed;
display:block;
z-index:30;
top:64px;
left:0;
bottom:0;
width:260px;
box-shadow:var(--shadow)
}

.main{
padding:16px 14px 90px
}

.grid,
.topicgrid{
grid-template-columns:1fr
}

.hero{
padding:22px
}

.hero h1{
font-size:26px
}

.toolbar{
align-items:flex-start;
flex-direction:column
}

.bottomnav{
position:fixed;
display:grid;
grid-template-columns:repeat(6,1fr);
bottom:0;
left:0;
right:0;
z-index:25;
background:rgba(255,255,255,.96);
backdrop-filter:blur(12px);
border-top:1px solid var(--line);
padding:5px
}

.bottomnav button{
border:0;
background:none;
color:var(--muted);
font-size:10px;
padding:5px 2px
}

.bottomnav button.active{
color:var(--primary);
font-weight:800
}

.searchbar{
flex-direction:column
}

.searchbar .primary{
width:100%
}

.clinical-table{
min-width:620px
}

}
</style>
</head>

<script>

const departments=[
"Medicine",
"General Surgery",
"O&G",
"Paediatrics",
"Orthopaedics",
"Emergency Medicine",
"Anaesthesiology",
"Primary Care",
"Psychiatry",

"Dermatology"
];


const refs={

"pre":{
"title":"MOH Malaysia — Management of Hypertension in Pregnancy",
"url":"https://www.moh.gov.my/moh/attachments/CPG_Management_of_Hypertension_4th_Edition.pdf"
},

"preterm":{
"title":"MOH Malaysia — Guidelines on Prevention and Management of Preterm Birth, 2023",
"url":"https://www.moh.gov.my/images/04-penerbitan/penerbitan-klinikal/perkhidmatan-OG-dan-pediatrik/Guideline_on_Prevention_and_Management_30Aug23.pdf"
},

"handbook":{
"title":"MOH Malaysia — Handbook of Obstetrics Guideline",
"url":"https://www.moh.gov.my/images/04-penerbitan/penerbitan-klinikal/perkhidmatan-OG-dan-pediatrik/FINAL_DRAF_LAYOUT_Handbook_of_Obstetrics_Guideline_PDF_compressed.pdf"
},

"gdm":{
"title":"MOH Malaysia — Management of Diabetes in Pregnancy, 2017",
"url":"https://www.moh.gov.my/moh/resources/Penerbitan/CPG/Endocrine/1a.pdf"
},

"pph":{
"title":"MOH Malaysia — Training Manual / Quick Reference Guide on Post Partum Haemorrhage, 2016",
"url":"https://hq.moh.gov.my/bpkk/index.php/pages/orang-awam/kesihatan-ibu-orang-awam.html"
},

"cpg":{
"title":"MOH Malaysia — Clinical Practice Guidelines hub",
"url":"https://www.moh.gov.my/penerbitan-dan-laporan/dasar-akta-polisi-garis-panduan/penerbitan-klinikal/senarai-penerbitan-klinikal/panduan-amalan-klinikal-cpg"
}

};


const topics=[

{
"id":"pe",
"d":"O&G",
"title":"Pre-eclampsia",
"tags":"hypertension pregnancy proteinuria severe features eclampsia",
"summary":"Placental disease with maternal endothelial dysfunction; recognise severe disease, stabilise mother and plan delivery.",
"refs":["pre","handbook"],

"sections":[

{
"title":"1. Definition & concept",
"kind":"text",
"content":"Pre-eclampsia is a pregnancy-specific multisystem disorder characterised by new hypertension after 20 weeks with maternal organ dysfunction and/or proteinuria. Think of it as a placental disorder that becomes clinically expressed through maternal endothelial and vascular dysfunction."
},

{
"title":"2. How does it happen?",
"kind":"why",
"content":"Abnormal placentation → inadequate spiral-artery remodelling → placental malperfusion/ischemia → release of anti-angiogenic and inflammatory factors → maternal endothelial dysfunction → vasoconstriction, capillary leak and organ injury.<br><br>This explains why disease can affect the brain, liver, kidneys, blood, lungs and placenta—not just blood pressure."
},

{
"title":"3. Clinical features — explain the “why”",
"kind":"table",
"content":{
"headers":["Finding","Why it happens"],
"rows":[
["Hypertension","↑ systemic vascular resistance from endothelial dysfunction and vasoconstriction."],
["Proteinuria","Glomerular endothelial injury increases permeability to protein."],
["Headache / visual symptoms","Cerebral endothelial dysfunction, vasospasm and/or cerebral oedema."],
["RUQ/epigastric pain","Hepatic involvement and capsular stretching/ischemia."],
["Thrombocytopenia","Platelet activation and consumption."],
["Raised AST/ALT","Hepatocellular injury."],
["Pulmonary oedema / dyspnoea","Capillary leak + increased afterload ± cardiac dysfunction."],
["Fetal growth restriction","Placental insufficiency reduces oxygen/nutrient transfer."]
]
}
},

{
"title":"4. History — ask with purpose",
"kind":"table",
"content":{
"headers":["Ask","Why?"],
"rows":[
["Gestation, previous BP readings","Distinguish chronic HTN from new-onset disease."],
["Headache, visual disturbance, confusion","Neurological severe features/eclampsia risk."],
["RUQ/epigastric pain, nausea/vomiting","Hepatic involvement/HELLP."],
["Dyspnoea/orthopnoea","Pulmonary oedema/cardiac involvement."],
["Reduced fetal movement","Possible fetal compromise."],
["Previous pre-eclampsia/FGR/placental disease","Recurrence and placental-risk assessment."]
]
}
},

{
"title":"5. Examination",
"kind":"table",
"content":{
"headers":["Examine","Look for"],
"rows":[
["BP — repeat correctly","Severity / acute hypertensive crisis."],
["Neurology","Clonus, hyperreflexia, altered mental state."],
["Respiratory system","Pulmonary oedema."],
["Abdomen","RUQ/epigastric tenderness; fundal height."],
["Obstetric assessment","Fetal heart, movements, presentation, uterine activity."],
["Fluid balance","Avoid under-resuscitation and fluid overload."]
]
}
},

{
"title":"6. Investigations",
"kind":"table",
"content":{
"headers":["Test","Purpose"],
"rows":[
["FBC / platelet","Anaemia, thrombocytopenia, HELLP component."],
["Renal profile / creatinine","Renal involvement and treatment baseline."],
["LFT","Hepatic involvement/HELLP."],
["Urine protein assessment","Document proteinuria where indicated."],
["CTG","Fetal wellbeing when gestationally appropriate."],
["Ultrasound growth + liquor + Doppler","Assess placental insufficiency/FGR."]
]
}
},

{
"title":"7. Management — clinical flow",
"kind":"flow",
"content":"Stabilise mother → confirm severity → control severe hypertension if present → magnesium sulfate when indicated for seizure prophylaxis/treatment → assess maternal organ function → assess fetus → involve senior O&G/MFM team → decide expectant management versus delivery based on maternal/fetal condition and gestation."
},

{
"title":"8. Severe disease / red flags",
"kind":"danger",
"content":"Severe headache, visual symptoms, epigastric/RUQ pain, pulmonary oedema, neurological signs, severe/persistent hypertension, thrombocytopenia, significant renal or hepatic dysfunction and fetal compromise should trigger urgent senior review and escalation.<br><br>Do not wait for a dramatic amount of proteinuria before recognising severe disease."
},

{
"title":"9. Delivery principle",
"kind":"text",
"content":"Delivery is the definitive treatment, but timing is a risk balance: maternal deterioration and fetal compromise favour delivery; stable mother and fetus may permit carefully monitored expectant management at appropriate gestations in a specialist setting."
},

{
"title":"10. Exam pearls",
"kind":"pearls",
"content":"Pre-eclampsia is multisystem—not simply “hypertension + proteinuria”.<br><br>Always assess both mother and fetus.<br><br>A severe BP is an emergency because stroke risk rises rapidly.<br><br>Magnesium sulfate prevents/treats eclamptic seizures; it is not the antihypertensive.<br><br>Delivery treats the underlying placental disease, but timing depends on clinical context."
}

]
},


{
"id":"fgr",
"d":"O&G",
"title":"Fetal Growth Restriction (FGR)",
"tags":"fgr SGA Delphi EFW AC umbilical artery Doppler MCA ductus venosus delivery",
"summary":"Differentiate constitutionally small fetuses from pathological growth restriction and use Doppler/surveillance to time delivery.",
"refs":["handbook"],

"sections":[

{
"title":"1. Definition & concept",
"kind":"text",
"content":"FGR means a fetus has failed to reach its biologically determined growth potential, usually because of placental insufficiency or another pathology. SGA is a size description; FGR is a clinical diagnosis involving abnormal growth and/or evidence of compromise."
},

{
"title":"2. How does it happen?",
"kind":"why",
"content":"Most placental FGR: abnormal placentation → high placental vascular resistance → reduced maternal–fetal exchange → fetal adaptation and reduced growth.<br><br>As placental resistance worsens, umbilical artery diastolic flow becomes reduced, absent or reversed; fetal redistribution may increase cerebral blood flow, reflected by MCA changes. Severe compromise may eventually affect venous Doppler and CTG."
},

{
"title":"3. Clinical features — explain the “why”",
"kind":"table",
"content":{
"headers":["Finding","Why / significance"],
"rows":[
["SFH smaller than expected","May reflect FGR, wrong dates, oligohydramnios or maternal habitus; screening only."],
["Reduced fetal movement","May reflect fetal hypoxaemia/compromise."],
["Small EFW/AC","Suggests reduced fetal growth; interpret with gestation and Doppler."],
["Oligohydramnios","Reduced fetal renal perfusion/urine output may accompany placental insufficiency."],
["Abnormal UA Doppler","Higher placental resistance; worsening disease may cause absent/reversed end-diastolic flow."],
["Low MCA resistance / abnormal CPR","Fetal redistribution (“brain sparing”) in placental insufficiency."]
]
}
},

{
"title":"4. History — ask with purpose",
"kind":"table",
"content":{
"headers":["Ask","Why?"],
"rows":[
["Accurate LMP/dating scan","Wrong dates can mimic FGR."],
["Serial SFH/growth scans","Trend is more useful than one measurement."],
["Reduced fetal movement","Screen for compromise."],
["Hypertension / pre-eclampsia","Major placental-risk association."],
["Smoking/substance exposure","Placental and fetal growth effects."],
["Previous FGR/stillbirth/abruption","Recurrence risk and placental pathology."],
["Diabetes/renal/autoimmune disease","Maternal vascular/metabolic contributors."]
]
}
},

{
"title":"5. Diagnosis — practical approach",
"kind":"flow",
"content":"1) Confirm gestational age. → 2) Assess EFW and AC. → 3) Look for serial growth trajectory. → 4) Assess amniotic fluid. → 5) Perform Doppler surveillance, especially umbilical artery. → 6) Add MCA/ductus venosus/CTG according to gestation, severity and local specialist protocol."
},

{
"title":"6. Doppler — understand the physiology",
"kind":"table",
"content":{
"headers":["Doppler","What it tells you"],
"rows":[
["Umbilical artery (UA)","Placental resistance. PI rises as placental vascular resistance increases; absent/reversed end-diastolic flow is severe placental disease."],
["MCA","Fetal cerebral adaptation. Reduced resistance may indicate redistribution/brain-sparing."],
["CPR","Combines cerebral and placental resistance; abnormality may support fetal redistribution/placental dysfunction."],
["Ductus venosus","Venous/cardiac adaptation; abnormal waveform can indicate advanced fetal compromise in selected early severe FGR."]
]
}
},

{
"title":"7. Surveillance",
"kind":"text",
"content":"Frequency is severity- and gestation-dependent. Combine fetal movement, CTG, liquor, UA Doppler and selected cerebral/venous Dopplers according to the local specialist pathway."
},

{
"title":"8. Delivery — high-yield framework",
"kind":"table",
"content":{
"headers":["Scenario","General principle"],
"rows":[
["Normal UA end-diastolic flow + reassuring surveillance","MOH handbook notes considering delivery from ≥37 weeks when other surveillance is normal."],
["UA absent/reversed end-diastolic flow","Higher risk; specialist/inpatient surveillance and earlier delivery are often required. MOH handbook advises delivery >32 weeks with absent/reversed flow."],
["28–32 weeks with AEDF/REDF","MOH handbook describes admission for CTG ± BPP ± venous Doppler, antenatal steroids and MgSO4 neuroprotection, with delivery for pathological CTG/BPP."],
["Pathological CTG / severe fetal compromise","Delivery may be indicated irrespective of growth percentile; urgent senior decision."]
]
}
},

{
"title":"9. IOL vs Caesarean",
"kind":"flow",
"content":"Mode depends on gestation, fetal status, Doppler, cervix and obstetric factors. A stable late-onset FGR fetus with reassuring testing may be suitable for induction and vaginal birth. Severe early FGR with significant Doppler/CTG abnormalities may require Caesarean because the fetus may not tolerate labour. Specialist decision."
},

{
"title":"10. Complications",
"kind":"bullets",
"content":[
"Fetal hypoxaemia → acidaemia → stillbirth.",
"Prematurity from indicated early delivery.",
"Neonatal hypoglycaemia, temperature instability and NICU admission.",
"Maternal disease such as pre-eclampsia may coexist."
]
},

{
"title":"11. Exam pearls",
"kind":"pearls",
"content":[
"Do not equate SGA with FGR.",
"UA Doppler primarily reflects placental resistance.",
"Absent/reversed EDF is a major escalation finding.",
"Always integrate gestation + growth + Doppler + CTG + maternal condition.",
"Delivery timing balances worsening placental disease against prematurity."
]
}

]
},


{
"id":"pprom",
"d":"O&G",
"title":"PPROM & Preterm Labour",
"tags":"pprom preterm labour rupture membranes contractions steroids antibiotics MgSO4 tocolysis",
"summary":"Confirm membrane rupture, exclude infection/fetal compromise and manage prematurity using the Malaysian 2023 guideline.",
"refs":["preterm","handbook"],

"sections":[

{
"title":"1. Definitions",
"kind":"text",
"content":"Preterm birth in the Malaysian 2023 guideline is birth from 22 weeks to before 37 completed weeks. PPROM means rupture of membranes before labour and before 37 weeks."
},

{
"title":"2. How does it happen?",
"kind":"why",
"content":"Membrane weakening can result from infection/inflammation, mechanical stress, cervical insufficiency, bleeding, smoking and other pathways.<br><br>Once membranes rupture, ascending infection becomes possible and loss of amniotic fluid may contribute to oligohydramnios and cord/fetal complications.<br><br>Preterm labour involves cervical remodelling, uterine activation and membrane/prostaglandin pathways before term."
},

{
"title":"3. Clinical features — explain the “why”",
"kind":"table",
"content":{
"headers":["Finding","Why it happens"],
"rows":[
["Sudden gush/continuous watery leakage","Amniotic fluid escapes through a membrane defect."],
["Regular painful contractions","Myometrial activation and cervical change indicate labour."],
["Fever / maternal tachycardia","Possible intra-amniotic infection."],
["Fetal tachycardia","Can reflect infection, hypoxia or other fetal stress."],
["Foul-smelling fluid","Raises suspicion of infection."],
["Reduced liquor","Ongoing membrane leak may reduce amniotic fluid."]
]
}
},

{
"title":"4. History — ask with purpose",
"kind":"table",
"content":{
"headers":["Ask","Why?"],
"rows":[
["Time, amount, colour and odour of fluid","Establish likelihood/timing and infection risk."],
["Contractions / pelvic pressure","Assess established preterm labour."],
["Fever/chills/unwellness","Infection."],
["Bleeding","Abruption/APH and possible contraindication to tocolysis."],
["Fetal movement","Fetal wellbeing."],
["Gestation and previous preterm birth","Determines treatment eligibility and recurrence risk."]
]
}
},

{
"title":"5. Examination",
"kind":"text",
"content":"Maternal vitals, abdominal tenderness/uterine activity and fetal heart rate are essential. Use a sterile speculum when assessing suspected PPROM where appropriate. Avoid routine digital vaginal examination because it can increase infection risk and shorten latency; reserve it when labour/delivery assessment requires it."
},

{
"title":"6. Investigations",
"kind":"text",
"content":"Diagnosis is primarily clinical with sterile speculum assessment and locally approved bedside tests when needed. Assess maternal infection and fetal wellbeing. CTG is used when appropriate to gestation/clinical state; ultrasound can assess liquor, presentation and growth. Do not use a test result in isolation if the clinical picture is discordant."
},

{
"title":"7. Management — Malaysian 2023 framework",
"kind":"flow",
"content":"Confirm PPROM/preterm labour → assess maternal infection and fetal status → determine gestational age → admit/refer to appropriate facility when indicated → antibiotics for PPROM according to local protocol → antenatal corticosteroids when eligible → MgSO4 for fetal neuroprotection when eligible and birth is likely soon → tocolysis only when appropriate and no contraindication → deliver for infection, established labour, fetal compromise, significant bleeding or other obstetric indication."
},

{
"title":"8. Antenatal corticosteroids",
"kind":"text",

).join("");

function route(id){

$$(".page").forEach(x=>x.classList.remove("active"));

el.classList.add("active");

$$(".navitem,.bottomnav button")
.forEach(x=>
x.classList.toggle("active",x.dataset.route===id)
);

window.scrollTo(0,0);

}

}

Guideline-first reference layer.
</p>


<div class="box">

<h3>Source hierarchy</h3>

<ol>

<li>
MOH Malaysia / MaHTAS CPG and official MOH guidelines

MOH specialist hospital / national protocols
</li>

Malaysian specialty guidance
</li>

WHO / FIGO / RCOG / NICE and other international guidance when Malaysian guidance does not fully cover the question
</li>

Textbooks and review literature for background physiology
</li>

</ol>

</div>


<div class="box source">

<h3>Current official CPG hub</h3>

<a
class="ref"
href="${refs.cpg.url}"
target="_blank"
rel="noopener">

↗ ${refs.cpg.title}

</a>

<p>

Use the latest official version and local hospital pathway.
Guideline recommendations support, but do not replace, clinical judgement.

</p>

</div>


<div class="box">

<h3>
O&G references currently built into MedMY
</h3>

${Object.entries(refs)
.filter(([k])=>k!=="cpg")
.map(([k,r])=>

`
<a
class="ref"
href="${r.url}"
target="_blank"
rel="noopener">

↗ ${r.title}

</a>
`

</div>

}


function renderSection(s){

if(s.kind==="table"){

return `

<div class="box">

<h3>${s.title}</h3>

<div class="tablewrap">

<table class="clinical-table">

<thead>

<tr>

${s.content.headers.map(h=>
`<th>${h}</th>`
).join("")}

</tr>

</thead>

<tbody>

${s.content.rows.map(r=>

`
<tr>

${r.map(c=>
`<td>${c}</td>`
).join("")}

</tr>
`

).join("")}

</tbody>

</table>

</div>

</div>

`;

}


if(s.kind==="bullets"){

const cls=s.contentClass||"";

return `

<div class="box
${s.title.toLowerCase().includes("pearl")?"pearls":""}
${cls}">

<h3>${s.title}</h3>

<ul>

${s.content.map(x=>
`<li>${x}</li>`
).join("")}

</ul>

</div>

`;

}


return `

<div class="box
${s.kind==="why"?"why":""}
${s.kind==="flow"?"warning":""}">

<h3>${s.title}</h3>

<p>${s.content}</p>

</div>

`;

}


function openTopic(id){

const t=topics.find(x=>x.id===id);

if(!t)return;


$("#searchPage").innerHTML=`

<div class="detail">

<button class="back" id="back">
← Back
</button>

<span class="badge">
${t.d}
</span>

<h1>
${t.title}
</h1>

<p class="sub">
${t.summary}
</p>

<button
class="chip ${saved.includes(id)?"active":""}"
id="saveTopic">

${saved.includes(id)?"★ Saved":"☆ Save topic"}

</button>

${t.sections.map(renderSection).join("")}

${refHTML(t.refs)}

</div>

`;


route("searchPage");


$("#back").onclick=()=>
route("study");


$("#saveTopic").onclick=()=>{

saved.includes(id)
?
saved=saved.filter(x=>x!==id)
:
saved.push(id);

localStorage.setItem(
"medmy_saved",
JSON.stringify(saved)
);

openTopic(id);

};

}


function doSearch(q){

q=(q||"").toLowerCase().trim();


const rs=topics.filter(t=>

(
t.title+
" "+
t.d+
" "+
t.tags+
" "+
t.summary+
" "+
t.sections
.map(s=>
s.title+" "+
JSON.stringify(s.content)
)
.join(" ")
)
.toLowerCase()
.includes(q)

);


$("#searchPage").innerHTML=`

<h1>Search</h1>

<div class="searchbar">

<input
id="s2"
value="${q.replaceAll('"','&quot;')}"
placeholder="Search topic…"
>

<button
class="primary"
id="sbtn">

Search

</button>

</div>


<div class="section">

${
rs.length
?
`
<div class="topicgrid">

${rs.map(topicCard).join("")}

</div>
`
:
`
<div class="empty">

No result.
Try another symptom or topic.

</div>
`
}

</div>

`;


route("searchPage");


$("#sbtn").onclick=()=>
doSearch($("#s2").value);


wireTopics();

}


function toggleTheme(){

document.documentElement.classList.toggle("dark");

localStorage.setItem(
"medmy_theme",
document.documentElement.classList.contains("dark")
?
"dark"
:
"light"
);

}


if(
localStorage.getItem("medmy_theme")==="dark"
)
document.documentElement.classList.add("dark");


init();

</script>

</body>
</html>
