<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ur study buddy — Malaysian Clinical Companion</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#18202a;
  --muted:#667085;
  --line:#e5e7eb;
  --accent:#2563eb;
  --danger:#dc2626;
  --ok:#15803d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input{font:inherit}
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 14px
}
.brand{font-weight:800;font-size:20px}
.sub{color:var(--muted);font-size:12px}
.search{
  margin-top:10px;
  display:flex;
  gap:8px
}
.search input{
  flex:1;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  background:#fff
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 12px
}
.tab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer
}
.tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}
.hero{
  background:linear-gradient(135deg,#111827,#334155);
  color:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:14px
}
.hero h1{
  margin:0 0 5px;
  font-size:26px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:12px
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  cursor:pointer;
  transition:.15s
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 24px #00000010
}
.tag{
  display:inline-block;
  font-size:11px;
  background:#eef2ff;
  color:#3730a3;
  border-radius:999px;
  padding:4px 8px;
  margin-bottom:8px
}
.card h3{
  font-size:16px;
  margin:2px 0 6px
}
.muted{color:var(--muted)}
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:10px 0
}
.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer
}
.topic{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px
}
.topic h1{margin-top:0}
.section{
  border-top:1px solid var(--line);
  padding:14px 0
}
.section h3{
  margin:0 0 7px
}
.why{color:#475467}
.flow{
  background:#f8fafc;
  border-left:4px solid var(--accent);
  padding:12px;
  border-radius:8px
}
.pearl{
  background:#fff7ed;
  border-left:4px solid #f97316;
  padding:12px;
  border-radius:8px
}
.warn{
  background:#fef2f2;
  border-left:4px solid var(--danger);
  padding:12px;
  border-radius:8px
}
.ref{
  font-size:12px;
  color:var(--muted)
}
.bottom{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  padding:8px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:20px
}
.stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px
}
.stat div{
  background:#ffffff14;
  padding:10px;
  border-radius:10px
}
.stat b{
  display:block;
  font-size:18px
}
.two{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}
.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  margin-right:4px
}
.badge.red{
  background:#fee2e2;
  color:#991b1b
}
.badge.green{
  background:#dcfce7;
  color:#166534
}
.badge.blue{
  background:#dbeafe;
  color:#1e40af
}
table{
  width:100%;
  border-collapse:collapse;
  margin:10px 0
}
th,td{
  border:1px solid var(--line);
  padding:9px;
  text-align:left;
  vertical-align:top
}
th{
  background:#f8fafc
}
.progress{
  background:#e5e7eb;
  height:7px;
  border-radius:99px;
  overflow:hidden
}
.progress>span{
  display:block;
  height:100%;
  background:var(--accent)
}
@media(max-width:700px){
  .two{grid-template-columns:1fr}
  .stat{grid-template-columns:1fr 1fr}
}
@media(min-width:800px){
  .bottom{display:none}
}
body.dark{
  --bg:#0b1220;
  --card:#111827;
  --text:#eef2f7;
  --muted:#a8b0bd;
  --line:#273244
}
body.dark .top,
body.dark .card,
body.dark .btn,
body.dark .tab,
body.dark .search input,
body.dark .bottom,
body.dark .topic{
  background:#111827
}
body.dark .flow{background:#0f172a}
body.dark th{background:#0f172a}
</style>
</head>

 investigations:"Presentation, estimated fetal weight, head flexion, placenta and maternal history.",
 management:"Discuss success/failure, emergency delivery risk, neonatal outcomes and individual preferences."
},

{
 id:"postpartum-assessment",
 cat:"Postnatal care",
 title:"Postpartum assessment",
 definition:"Routine maternal review after delivery focused on physical recovery, complications and psychosocial wellbeing.",
 investigations:"Vital signs, uterine involution, bleeding, wound/perineum, urine, breasts and mental health.",
 management:"Identify PPH, infection, VTE, urinary retention and hypertensive complications; provide contraception and breastfeeding support."
},

{
 id:"postpartum-endometritis",
 cat:"Postnatal care",
 title:"Postpartum endometritis",
 definition:"Uterine infection after delivery, more common after caesarean birth.",
 investigations:"Fever, uterine tenderness, foul lochia, FBC and cultures when indicated.",
 management:"Broad-spectrum antibiotics and evaluate for retained products or other infection source."
},

{
 id:"postpartum-hypertension",
 cat:"Postnatal care",
 title:"Postpartum hypertension",
 definition:"Hypertension persisting or developing after delivery.",
 investigations:"BP, symptoms, urine protein and renal/liver/platelet tests when indicated.",
 management:"Monitor closely, treat severe hypertension urgently and review antihypertensive compatibility with breastfeeding."
},

{
 id:"postpartum-depression",
 cat:"Postnatal care",
 title:"Postpartum depression",
 definition:"Depressive illness arising after childbirth that affects mood, function and maternal-infant wellbeing.",

},

{

}

];

/* =========================================================
   REFERENCES
   ========================================================= */

const refs = [

[
 "MOH Handbook of Obstetrics Guidelines 2024",
 "https://jknselangor.moh.gov.my/hsis/images/hsis/medical_info/Handbook_of_Obstetrics_Guidelines_2024.pdf"
],

[
 "MOH Guidelines on Prevention and Management of Preterm Birth 2023",
 "https://www.moh.gov.my/moh/resources/Penerbitan/Perkhidmatan%20Perubatan/2023/GARIS_PANDUAN_PENGURUSAN_KELAHIRAN_PRATEM.pdf"
],

[
 "MOH Guidelines on Induction of Labour 2021",
 "https://www.moh.gov.my/moh/resources/Penerbitan/Perkhidmatan%20Perubatan/2021/Garis_Panduan_Induksi_Kelahiran_2021.pdf"
],

[
 "MOH Clinical Practice Guidelines",
 "https://www.moh.gov.my/index.php/pages/view/1273"
]

];

/* =========================================================
   STATE
   ========================================================= */

let saved = JSON.parse(
  localStorage.getItem("medmy_og_saved") || "[]"
);

let cat = "All";
let current = null;

/* =========================================================
   UTILITY
   ========================================================= */

function esc(s){
  return String(s).replace(
    /[&<>"]/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[m])
  );
}

function categories(){
  return ["All",...new Set(topics.map(x=>x.cat))];
}

/* =========================================================
   HOME
   ========================================================= */

function render(){

  const app=document.getElementById("app");

  if(current){
    return renderTopic(current);
  }

  const cats=categories();

  const filtered =
    cat==="All"
    ? topics
    : topics.filter(t=>t.cat===cat);

  app.innerHTML = `

    <div class="hero">

      <h1>Obstetrics & Gynaecology</h1>

      <div>
        Malaysian-focused high-yield notes for
        clinical posting, viva, OBA/MCQ and HO on-call.
      </div>

      <div class="stat">

        <div>
          <b>${topics.length}</b>
          Topics
        </div>

        <div>
          <b>${new Set(topics.map(t=>t.cat)).size}</b>
          Categories
        </div>

        <div>
          <b>${saved.length}</b>
          Saved
        </div>

      </div>

    </div>

    <div class="tabs">

      ${cats.map(c=>`

        <button
          class="tab ${c===cat?"active":""}"
          onclick="setCat('${esc(c)}')"
        >
          ${esc(c)}
        </button>

      `).join("")}

    </div>

    <div class="toolbar">

      <b>
        ${cat==="All"?"All O&G":esc(cat)}
      </b>

      <span class="muted">
        ${filtered.length} topics
      </span>

    </div>

    <div class="grid">

      ${filtered.map(card).join("")}

    </div>

    <div class="section">

      <h3>Malaysian references</h3>

      ${
        refs.map(r=>`

          <div class="ref">
            •
            <a
              href="${r[1]}"
              target="_blank"
              rel="noopener"
            >
              ${esc(r[0])}
            </a>
          </div>

        `).join("")
      }

    </div>

  `;
}

/* =========================================================
   CARD
   ========================================================= */

function card(t){

  return `

    <article
      class="card"
      onclick="openTopic('${t.id}')"
    >

      <span class="tag">
        ${esc(t.cat)}
      </span>

      <h3>
        ${esc(t.title)}
      </h3>

      <div class="muted">
        ${esc(t.definition)}
      </div>

    </article>

  `;
}

/* =========================================================
   CATEGORY
   ========================================================= */

function setCat(c){

  cat=c;
  current=null;

  render();

  window.scrollTo(0,0);
}

/* =========================================================
   TOPIC
   ========================================================= */

function openTopic(id){

  current=topics.find(t=>t.id===id);

  renderTopic(current);

  window.scrollTo(0,0);
}

/* =========================================================
   TOPIC PAGE
   ========================================================= */

function renderTopic(t){

  const app=document.getElementById("app");

  const isSaved=saved.includes(t.id);

  app.innerHTML = `

    <div class="toolbar">

      <button
        class="btn"
        onclick="current=null;render()"
      >
        ← Back
      </button>

      <button
        class="btn"
        onclick="saveTopic('${t.id}')"
      >
        ${isSaved?"★ Saved":"☆ Save"}
      </button>

    </div>

    <article class="topic">

      <span class="tag">
        ${esc(t.cat)}
      </span>

      <h1>
        ${esc(t.title)}
      </h1>


      <div class="section">

        <h3>
          Definition
        </h3>

        <p>
          ${esc(t.definition)}
        </p>

      </div>


      <div class="section">

        <h3>
          How it happens / why it matters
        </h3>

        <p class="why">

          Think of the condition in terms of
          maternal physiology, placenta, fetus,
          anatomy, infection, hormones or
          mechanical factors.

          Always connect the clinical finding
          to its mechanism.

        </p>

      </div>


      <div class="section">

        <h3>
          Clinical features + WHY
        </h3>

        <table>

          <thead>
            <tr>
              <th>Feature</th>
              <th>Why it happens / significance</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td>Presenting symptoms</td>
              <td>
                Reflect the main physiological,
                anatomical or pathological process.
              </td>
            </tr>

            <tr>
              <td>Severity / progression</td>
              <td>
                Helps distinguish mild disease
                from an evolving emergency.
              </td>
            </tr>

            <tr>
              <td>Associated symptoms</td>
              <td>
                May indicate complications or
                alternative diagnoses.
              </td>
            </tr>

          </tbody>

        </table>

      </div>


      <div class="section">

        <h3>
          History — ask + why
        </h3>

        <ul>

          <li>
            <b>Presenting symptom, onset, severity and progression</b>
            —
            establishes acuity and differential.
          </li>

          <li>
            <b>Obstetric/menstrual history</b>
            —
            gestational age or cycle pattern changes diagnosis and management.
          </li>

          <li>
            <b>Previous pregnancy, delivery, surgery and complications</b>
            —
            identifies recurrence and operative risk.
          </li>

          <li>
            <b>Medical/drug/allergy history</b>
            —
            identifies contraindications and maternal risk.
          </li>

          <li>
            <b>Red flags</b>
            —
            bleeding, severe pain, fever,
            reduced fetal movement,
            severe headache/visual symptoms,
            dyspnoea or collapse.
          </li>

        </ul>

      </div>


      <div class="section">

        <h3>
          Examination — what + significance
        </h3>

        <ul>

          <li>
            <b>ABCDE + vital signs</b>
            —
            detects maternal instability.
          </li>

          <li>
            <b>General examination</b>
            —
            pallor, oedema, hydration,
            respiratory/cardiovascular signs.
          </li>

          <li>
            <b>Abdominal examination</b>
            —
            tenderness, uterine size,
            lie/presentation,
            contractions, fetal heart and growth.
          </li>

          <li>
            <b>Pelvic/speculum/PV examination</b>
            —
            only when indicated and safe;
            assesses cervix, bleeding, membranes
            or pelvic pathology.
          </li>

        </ul>

      </div>


      <div class="section">

        <h3>
          Investigations + interpretation
        </h3>

        <p>
          ${esc(t.investigations)}
        </p>

        <ul>

          <li>
            <b>FBC</b>
            —
            anaemia, thrombocytopenia or infection markers.
          </li>

          <li>
            <b>Renal/liver/coagulation tests</b>
            —
            selected according to clinical indication.
          </li>

          <li>
            <b>Ultrasound</b>
            —
            anatomy, growth, placenta, liquor and pelvic pathology.
          </li>

          <li>
            <b>CTG</b>
            —
            fetal wellbeing assessment where appropriate.
          </li>

          <li>
            <b>Doppler</b>
            —
            placental/fetal haemodynamic assessment
            in selected pregnancies.
          </li>

        </ul>

      </div>


      <div class="section">

        <h3>
          Diagnosis / classification
        </h3>

        <div class="flow">

          <b>
            Clinical context
            →
            focused examination
            →
            targeted tests
            →
            classify severity
            →
            identify complications
            →
            treatment plan
          </b>

        </div>

      </div>


      <div class="section">

        <h3>
          Management
        </h3>

        <p>
          ${esc(t.management)}
        </p>

        <ol>

          <li>
            Stabilise first if unstable.
          </li>

          <li>
            Treat the underlying cause
            and reversible factors.
          </li>

          <li>
            Monitor maternal and fetal response
            where relevant.
          </li>

          <li>
            Escalate early for severe disease,
            deterioration or diagnostic uncertainty.
          </li>

          <li>
            Document diagnosis, counselling,
            plan and safety-net instructions.
          </li>

        </ol>

      </div>


      <div class="section">

        <h3>
          HO / On-call action
        </h3>

        <div class="warn">

          <b>Red flags:</b>

          haemodynamic instability,
          major haemorrhage,
          persistent fetal compromise,
          severe hypertension/eclampsia,
          sepsis,
          acute abdomen,
          cord prolapse,
          shoulder dystocia
          or maternal collapse.

          <br><br>

          →
          Call senior O&G help immediately
          and activate the relevant emergency pathway.

        </div>

      </div>


      <div class="section">

        <h3>
          Exam pearls
        </h3>

        <div class="pearl">

          • Always state gestational age
          when discussing an obstetric case.

          <br>

          • In emergencies:
          maternal resuscitation and diagnosis
          happen in parallel.

          <br>

          • For management questions:
          give indication
          →
          immediate stabilisation
          →
          definitive treatment
          →
          monitoring
          →
          complications.

        </div>

      </div>


      <div class="section">

        <h3>
          Malaysian guideline note
        </h3>

        <p class="ref">

          Use the current MOH Malaysia/JPPOBG
          guideline and your hospital's current SOP.

          Exact drug doses, delivery thresholds,
          referral pathways and treatment protocols
          should be checked against the latest
          approved document.

        </p>

      </div>

    </article>

  `;
}

/* =========================================================
   SAVE
   ========================================================= */

function saveTopic(id){

  if(saved.includes(id)){

    saved=saved.filter(x=>x!==id);

  }else{

    saved=[...saved,id];

  }

  localStorage.setItem(
    "medmy_og_saved",
    JSON.stringify(saved)
  );

  renderTopic(
    topics.find(t=>t.id===id)
  );
}

/* =========================================================
   SEARCH
   ========================================================= */

function search(q){

  q=q.trim().toLowerCase();

  if(!q){

    current=null;
    render();
    return;

  }

  current=null;

  const app=document.getElementById("app");

  const hits=topics.filter(t=>
    (
      t.title+
      " "+
      t.cat+
      " "+
      t.definition+
      " "+
      t.investigations+
      " "+
      t.management
    )
    .toLowerCase()
    .includes(q)
  );

  app.innerHTML = `

    <div class="toolbar">

      <b>
        ${hits.length} result(s)
      </b>

      <button
        class="btn"
        onclick="
          document.getElementById('q').value='';
          render()
        "
      >
        Clear
      </button>

    </div>

    <div class="grid">

      ${hits.map(card).join("")}

    </div>

  `;
}

/* =========================================================
   DARK MODE
   ========================================================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "medmy_og_dark",
    document.body.classList.contains("dark")
  );

}

if(
  localStorage.getItem("medmy_og_dark")==="true"
){
  document.body.classList.add("dark");
}

/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();

</script>

</body>
</html>
